<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>知識聚合自動化</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css" />
    <link rel="icon" href="https://api.iconify.design/fluent/brain-circuit-24-filled.svg?color=%2300d4ff" type="image/svg+xml" />
    <style>
      :root {
        --theme-color: #00d4ff;
      }
      body {
        background-color: #0d0d0d;
        color: #e0e0e0;
      }
      .sidebar {
        background-color: #111111;
        border-right: 1px solid #222;
      }
      .sidebar ul li a {
        color: #cccccc;
      }
      .sidebar ul li a:hover {
        color: #00d4ff;
      }
      .app-name-link {
        color: #00d4ff !important;
        font-weight: bold;
      }
      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3 {
        color: #00d4ff;
      }
      .markdown-section a {
        color: #00d4ff;
      }
      .markdown-section code {
        background: #1a1a1a;
        color: #00d4ff;
      }
      .content {
        background-color: #0d0d0d;
      }

      /* Center navbar links */
      .app-nav {
        text-align: center !important;
        right: 0 !important;
        left: 0 !important;
        margin: 0 auto !important;
        width: 100% !important;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .app-nav > ul {
        display: flex !important;
        justify-content: center !important;
      }

      /* Navbar dropdown dark background */
      .app-nav ul {
        background-color: #111111 !important;
        border: 1px solid #333 !important;
        border-radius: 8px !important;
        box-shadow: 0 4px 16px rgba(0,0,0,0.6) !important;
      }
      .app-nav ul li a {
        color: #cccccc !important;
      }
      .app-nav ul li a:hover {
        color: #00d4ff !important;
        background-color: #1a1a1a !important;
      }
      .app-nav li:hover ul {
        background-color: #111111 !important;
      }

      /* Card styles */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 24px;
      }
      @media (max-width: 768px) {
        .card-grid {
          grid-template-columns: 1fr;
        }
      }
      .card {
        display: block;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 20px 16px;
        text-align: center;
        text-decoration: none !important;
        color: #e0e0e0 !important;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        cursor: pointer;
      }
      .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 8px 30px rgba(0, 212, 255, 0.35);
        border-color: #00d4ff;
        color: #e0e0e0 !important;
        text-decoration: none !important;
      }
      .card-icon {
        font-size: 2rem;
        margin-bottom: 10px;
      }
      .card-title {
        font-size: 1rem;
        font-weight: bold;
        color: #00d4ff;
        margin-bottom: 8px;
      }
      .card-desc {
        font-size: 0.82rem;
        color: #aaaaaa;
        line-height: 1.5;
        margin-bottom: 12px;
      }
      .card-tag {
        display: inline-block;
        background: #1a3a4a;
        color: #00d4ff;
        font-size: 0.7rem;
        padding: 4px 10px;
        border-radius: 12px;
        margin: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: "知識聚合自動化",
        repo: "https://github.com/jaylooloomi/docsify",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        search: {
          paths: "auto",
          placeholder: "🔍 搜尋...",
          noData: "😞 找不到結果",
          depth: 3,
        },
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  </body>
</html>
