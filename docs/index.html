<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>知識聚合自動化</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css" />
    <link rel="icon" href="https://api.iconify.design/fluent/brain-circuit-24-filled.svg?color=%2300d4ff" type="image/svg+xml" />
    <style>
      :root {
        --theme-color: #00d4ff;
      }
      body {
        background-color: #0d0d0d;
        color: #e0e0e0;
      }
      .sidebar {
        background-color: #111111;
        border-right: 1px solid #222;
      }
      .sidebar ul li a {
        color: #cccccc;
      }
      .sidebar ul li a:hover {
        color: #00d4ff;
      }
      .app-name-link {
        color: #00d4ff !important;
        font-weight: bold;
      }
      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3 {
        color: #00d4ff;
      }
      .markdown-section a {
        color: #00d4ff;
      }
      .markdown-section code {
        background: #1a1a1a;
        color: #00d4ff;
      }
      .content {
        background-color: #0d0d0d;
      }

      /* Navbar: 靠右 */
      .app-nav {
        position: fixed;
        top: 0;
        right: 16px;
        left: auto;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 12px 0;
        z-index: 100;
      }
      .app-nav > ul {
        display: flex !important;
        list-style: none;
        margin: 0;
        padding: 0;
        gap: 8px;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }
      .app-nav > ul > li > a {
        color: #cccccc !important;
        font-size: 15px;
        padding: 6px 14px;
      }
      .app-nav > ul > li > a:hover {
        color: #00d4ff !important;
      }

      /* 下拉子選單才加黑底 */
      .app-nav > ul > li > ul {
        background-color: #111111 !important;
        border: 1px solid #333 !important;
        border-radius: 8px !important;
        box-shadow: 0 4px 16px rgba(0,0,0,0.6) !important;
        min-width: 160px;
      }
      .app-nav > ul > li > ul li a {
        color: #cccccc !important;
      }
      .app-nav > ul > li > ul li a:hover {
        color: #00d4ff !important;
        background-color: #1a1a1a !important;
      }

      /* Card styles */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 24px;
      }
      @media (max-width: 768px) {
        .card-grid {
          grid-template-columns: 1fr;
        }
      }
      .card {
        display: block;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 20px 16px;
        text-align: center;
        text-decoration: none;
        color: inherit;
        transition: all 0.3s ease;
      }
      .card:hover {
        transform: translateY(-4px);
        border-color: #00d4ff;
        box-shadow: 0 8px 24px rgba(0, 212, 255, 0.2);
      }
      .card-icon {
        font-size: 48px;
        margin-bottom: 12px;
        display: block;
      }
      .card-title {
        font-size: 18px;
        font-weight: bold;
        color: #00d4ff;
        margin-bottom: 8px;
      }
      .card-desc {
        font-size: 14px;
        color: #999;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="/">首頁</a>
      <a href="#/knowledge">
        知識分類
        <ul>
          <li><a href="#/markdowns/github/">🔥 GitHub 熱門熱點</a></li>
          <li><a href="#/markdowns/japan/">🌑 日本暗黑行程</a></li>
          <li><a href="#/markdowns/news/">🌍 世界熱門新聞</a></li>
          <li><a href="#/markdowns/money/">💰 賺錢點子</a></li>
          <li><a href="#/markdowns/services/">🛠️ 服務供應商</a></li>
          <li><a href="#/markdowns/stickers/">🎨 原創貼圖</a></li>
          <li><a href="#/markdowns/extensions/">🔌 瀏覽器外掛</a></li>
        </ul>
      </a>
    </nav>

    <div id="app"></div>
    <script>
      window.$docsify = {
        name: "知識聚合自動化",
        repo: "jaylooloomi/docsify",
        loadSidebar: true,
        subMaxLevel: 3,
        auto2top: true,
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  </body>
</html>
